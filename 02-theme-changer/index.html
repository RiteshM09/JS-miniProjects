<head>

    <link rel="stylesheet" href="style2.css">
    <title>MODE</title>
</head>
<body>
    <div id="container">
        <h2 id="text"></h2>
        <label class="switch">
            <input type="checkbox" id="InputBox">
            <span class="slider"></span>
        </label>      
    </div>
    <div id="colors">
        <button  class="color" id="limegreen" style="background-color: rgb(52, 212, 52);">GREEN</button> 
        <button  class="color" id="blue" style="background-color: rgb(96, 172, 230);">BLUE</button>
        <button  class="color" id="purple" style="background-color: rgb(182, 41, 182);">PURPLE</button>
        <button  class="color" id="yellow" style="background-color: rgb(227, 227, 29);">YELLOW</button>
        <button  class="color" id="pink" style="background-color: rgb(235, 136, 152);">PINK</button>
    </div>
    
    <script src="script2.js"></script>

</html>
